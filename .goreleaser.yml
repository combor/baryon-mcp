version: 2

project_name: baryon-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: baryon-mcp
    main: ./cmd/baryon-mcp
    binary: baryon-mcp
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        # Waiting for Apple's verdict keeps a rejected binary out of the archives.
        wait: true
        timeout: 20m

archives:
  - formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

aurs:
  - name: baryon-mcp-bin
    homepage: https://github.com/combor/baryon-mcp
    description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    license: BSD-3-Clause
    maintainers:
      - 'combor <163394+combor@users.noreply.github.com>'
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/baryon-mcp-bin.git'
    # A prerelease tag such as v0.4.0-rc1 must not become the package's current version.
    skip_upload: auto
    provides:
      - baryon-mcp
    conflicts:
      - baryon-mcp
    package: |-
      install -Dm755 "./baryon-mcp" "${pkgdir}/usr/bin/baryon-mcp"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/baryon-mcp-bin/LICENSE"

homebrew_casks:
  - name: baryon-mcp
    homepage: https://github.com/combor/baryon-mcp
    description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    repository:
      owner: combor
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    # A prerelease tag such as v0.4.0-rc1 must not become the cask's current version.
    skip_upload: auto

changelog:
  disable: true
