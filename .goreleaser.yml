version: 2

project_name: baryon-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: baryon-mcp
    main: ./cmd/baryon-mcp
    binary: baryon-mcp
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        # Waiting for Apple's verdict keeps a rejected binary out of the archives.
        wait: true
        timeout: 20m

archives:
  - id: baryon-mcp
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

nfpms:
  - id: baryon-mcp-rpm
    package_name: baryon-mcp
    ids:
      - baryon-mcp
    vendor: combor
    homepage: https://github.com/combor/baryon-mcp
    maintainer: 'combor <163394+combor@users.noreply.github.com>'
    description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    license: BSD-3-Clause
    formats:
      - rpm
    bindir: /usr/bin
    rpm:
      signature:
        key_file: '{{ if isEnvSet "GPG_KEY_PATH" }}{{ .Env.GPG_KEY_PATH }}{{ end }}'
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/baryon-mcp/LICENSE

aurs:
  - name: baryon-mcp-bin
    homepage: https://github.com/combor/baryon-mcp
    description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    license: BSD-3-Clause
    maintainers:
      - 'combor <163394+combor@users.noreply.github.com>'
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/baryon-mcp-bin.git'
    # A prerelease tag such as v0.4.0-rc1 must not become the package's current version.
    skip_upload: auto
    provides:
      - baryon-mcp
    conflicts:
      - baryon-mcp
    # Any org.freedesktop.secrets provider lets setup store the Bridge
    # password in a keyring instead of a mode-600 file.
    optdepends:
      - 'gnome-keyring: Secret Service keyring for the Bridge password (auto-unlocks at login)'
      - 'kwallet: Secret Service provider on KDE Plasma'
      - 'keepassxc: Secret Service provider while its database is unlocked'
    # Post-install notice pointing at `baryon-mcp setup`, which stores the
    # per-user Bridge credentials the package itself cannot create.
    install: scripts/aur/baryon-mcp-bin.install
    package: |-
      install -Dm755 "./baryon-mcp" "${pkgdir}/usr/bin/baryon-mcp"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/baryon-mcp-bin/LICENSE"

homebrew_casks:
  - name: baryon-mcp
    homepage: https://github.com/combor/baryon-mcp
    description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    repository:
      owner: combor
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    # A prerelease tag such as v0.4.0-rc1 must not become the cask's current version.
    skip_upload: auto

winget:
  - name: baryon-mcp
    publisher: combor
    package_identifier: Combor.BaryonMCP
    package_name: Baryon MCP
    short_description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    description: A local, permission-limited MCP bridge between Proton Mail and the AI you choose.
    installation_notes: Run "baryon-mcp setup" after Proton Mail Bridge is installed and running.
    license: BSD-3-Clause
    license_url: https://github.com/combor/baryon-mcp/blob/main/LICENSE
    homepage: https://github.com/combor/baryon-mcp
    publisher_url: https://github.com/combor
    publisher_support_url: https://github.com/combor/baryon-mcp/issues
    default_locale: en-GB
    ids:
      - baryon-mcp
    tags:
      - email
      - mcp
      - proton-mail
      - proton-mail-bridge
    # A prerelease tag such as v0.4.0-rc1 must not be submitted to WinGet.
    skip_upload: auto
    repository:
      owner: combor
      name: winget-pkgs
      token: '{{ .Env.WINGET_GITHUB_TOKEN }}'
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  disable: true
