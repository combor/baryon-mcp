version: 2

project_name: baryon-mcp

before:
  hooks:
    - go mod tidy
    # Warm the npx cache serially; concurrent post-build hooks otherwise race
    # to install @anthropic-ai/mcpb on a cold cache and read torn modules.
    - npx --yes @anthropic-ai/mcpb@2.1.2 --version

builds:
  - id: baryon-mcp
    main: ./cmd/baryon-mcp
    binary: baryon-mcp
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    hooks:
      # Packs each binary into an MCPB bundle.
      post:
        - cmd: ./scripts/mcpb-pack.sh {{ .Os }} {{ .Arch }} "{{ .Path }}" {{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

aurs:
  - name: baryon-mcp-bin
    homepage: https://github.com/combor/baryon-mcp
    description: Read Proton Mail and save drafts through your local Proton Mail Bridge.
    license: BSD-3-Clause
    maintainers:
      - 'combor <163394+combor@users.noreply.github.com>'
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/baryon-mcp-bin.git'
    # A prerelease tag such as v0.4.0-rc1 must not become the package's current version.
    skip_upload: auto
    provides:
      - baryon-mcp
    conflicts:
      - baryon-mcp
    package: |-
      install -Dm755 "./baryon-mcp" "${pkgdir}/usr/bin/baryon-mcp"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/baryon-mcp-bin/LICENSE"

release:
  extra_files:
    - glob: dist/mcpb/*.mcpb

changelog:
  disable: true
