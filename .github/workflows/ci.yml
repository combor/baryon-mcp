name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          cache: false

  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: Shell script checks
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck scripts/render_server_json.sh scripts/render_server_json_test.sh scripts/mcpb-pack-all.sh
          bash scripts/render_server_json_test.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json

  container-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: baryon-mcp:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: MCP introspection without credentials
        env:
          BARYON_SMOKE_IMAGE: baryon-mcp:ci
        run: go test -count=1 -run TestContainerServesIntrospection ./cmd/baryon-mcp

  release:
    name: Release
    needs:
      - test
      - govulncheck
      - container-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Notarization waits on Apple per darwin binary in turn, up to 20 minutes
    # each, on top of build and upload.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Prepare RPM signing key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$RPM_GPG_PRIVATE_KEY" ]; then
            echo "RPM_GPG_PRIVATE_KEY is not configured"
            exit 1
          fi
          umask 077
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/rpm-signing-private.asc"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenPGP private key materialized in the runner's temporary directory.
          GPG_KEY_PATH: ${{ runner.temp }}/rpm-signing-private.asc
          # SSH private key of the AUR account that owns baryon-mcp-bin.
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # The job's own token cannot write to combor/homebrew-tap, so the cask
          # needs a PAT with contents write access to that repository.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Developer ID certificate and App Store Connect key used to sign and
          # notarize the darwin binaries.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: Upload WinGet manifests
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: dist/winget/manifests
          if-no-files-found: error
          retention-days: 1
      - name: Pack MCPB bundles
        run: scripts/mcpb-pack-all.sh
      - name: Attach MCPB bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --clobber

  validate-winget:
    name: Validate WinGet Manifest
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download generated manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-manifests
          path: winget-manifests
      - name: Ensure WinGet is available
        shell: pwsh
        run: |
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Scope CurrentUser -Force
            Import-Module Microsoft.WinGet.Client
            Repair-WinGetPackageManager -Force -Latest
          }
          winget --info
          if ($LASTEXITCODE -ne 0) {
            throw "winget is not available"
          }
      - id: manifest
        name: Locate manifests and require schema 1.12
        shell: pwsh
        run: |
          $versionManifests = @(
            Get-ChildItem -Path winget-manifests -Recurse -File -Filter 'Combor.BaryonMCP.yaml'
          )
          if ($versionManifests.Count -ne 1) {
            throw "expected one Combor.BaryonMCP version manifest, found $($versionManifests.Count)"
          }

          $manifestPath = $versionManifests[0].Directory.FullName
          $manifests = @(Get-ChildItem -LiteralPath $manifestPath -File -Filter '*.yaml')
          if ($manifests.Count -ne 3) {
            throw "expected three manifest files, found $($manifests.Count)"
          }

          $wrongSchema = @(
            $manifests | Where-Object {
              -not (Select-String -LiteralPath $_.FullName -Pattern '^ManifestVersion:\s+1\.12\.0\s*$' -Quiet)
            }
          )
          if ($wrongSchema.Count -ne 0) {
            throw "manifest files do not all declare schema 1.12.0: $($wrongSchema.Name -join ', ')"
          }

          "path=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Validate manifest
        shell: pwsh
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
        run: |
          winget validate --manifest $env:MANIFEST_PATH --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget manifest validation failed"
          }
      - name: Install and verify manifest
        shell: pwsh
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
        run: |
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) {
            throw "could not enable local manifest installation"
          }

          winget install --manifest $env:MANIFEST_PATH --scope user --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget manifest installation failed"
          }

          $links = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          if (Test-Path -LiteralPath $links) {
            $env:PATH = "$links;$env:PATH"
          }
          $command = Get-Command baryon-mcp.exe -ErrorAction SilentlyContinue
          if (-not $command) {
            throw "baryon-mcp.exe was not installed on PATH"
          }

          $output = (& $command.Source --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "the installed baryon-mcp executable failed: $output"
          }
          $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($output -notmatch [regex]::Escape($expectedVersion)) {
            throw "installed version did not match ${expectedVersion}: $output"
          }
          Write-Host $output

  submit-winget:
    name: Submit WinGet Pull Request
    needs:
      - validate-winget
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require WinGet publishing token
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "WINGET_GITHUB_TOKEN is not configured" >&2
            exit 1
          fi
      - name: Check out WinGet fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combor/winget-pkgs
          ref: master
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
          path: winget-pkgs
      - name: Download validated manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-manifests
          path: generated-manifests
      - name: Commit manifests and open pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          branch="baryon-mcp-$version"
          head="combor:$branch"
          existing_url=$(gh api --method GET repos/microsoft/winget-pkgs/pulls \
            -f state=open -f head="$head" --jq '.[0].html_url // empty')
          if [ -n "$existing_url" ]; then
            echo "WinGet pull request already exists: $existing_url"
            exit 0
          fi

          duplicate_url=$(gh pr list --repo microsoft/winget-pkgs --state open \
            --search '"Combor.BaryonMCP" in:title' --limit 1 --json url \
            --jq '.[0].url // empty')
          if [ -n "$duplicate_url" ]; then
            echo "another Combor.BaryonMCP pull request is already open: $duplicate_url" >&2
            exit 1
          fi

          repo=winget-pkgs
          git -C "$repo" remote add upstream https://github.com/microsoft/winget-pkgs.git
          git -C "$repo" fetch --depth=1 upstream master
          if git -C "$repo" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git -C "$repo" fetch --depth=1 origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"
            git -C "$repo" switch -c "$branch" "origin/$branch"
          else
            git -C "$repo" switch -c "$branch" upstream/master
          fi

          relative_path="manifests/c/Combor/BaryonMCP/$version"
          generated="generated-manifests/c/Combor/BaryonMCP/$version"
          target="$repo/$relative_path"
          if [ ! -d "$generated" ]; then
            echo "generated manifest directory is missing: $generated" >&2
            exit 1
          fi
          if git -C "$repo" cat-file -e "upstream/master:$relative_path" 2>/dev/null; then
            echo "Combor.BaryonMCP $version is already present upstream"
            exit 0
          fi

          mkdir -p "$target"
          cp "$generated"/*.yaml "$target/"
          git -C "$repo" config user.name goreleaserbot
          git -C "$repo" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$repo" add "$relative_path"

          if git -C "$repo" cat-file -e upstream/master:manifests/c/Combor/BaryonMCP 2>/dev/null; then
            title="Update: Combor.BaryonMCP to $version"
          else
            title="New package: Combor.BaryonMCP version $version"
          fi
          if ! git -C "$repo" diff --cached --quiet; then
            git -C "$repo" commit -m "$title" \
              -m "Publish the release after WinGet schema and installation checks passed."
          fi

          mapfile -t changed < <(git -C "$repo" diff --name-only upstream/master HEAD)
          if [ "${#changed[@]}" -ne 3 ]; then
            echo "expected exactly three changed manifest files, found ${#changed[@]}" >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              "$relative_path"/*.yaml) ;;
              *) echo "unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done

          git -C "$repo" push --set-upstream origin "$branch"
          gh pr create --repo microsoft/winget-pkgs --base master --head "$head" \
            --title "$title" --body-file .github/winget-pr.md

  publish-container:
    name: Publish Container Image
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The arm64 image is cross-compiled by Go and its runtime stage only
      # copies that binary in, so no emulation is involved.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/combor/baryon-mcp
          # A prerelease tag such as v0.4.0-rc1 must not move latest.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published image is public
        run: |
          repo=combor/baryon-mcp
          manifest=$RUNNER_TEMP/ghcr-manifest.json
          if ! curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" -o "$RUNNER_TEMP/ghcr-token.json"; then
            echo "anonymous pull denied: set the GHCR package to public in its settings, then re-run this job"
            exit 1
          fi
          token=$(jq -r .token "$RUNNER_TEMP/ghcr-token.json")
          curl -fsSL -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/$repo/manifests/${{ steps.build.outputs.digest }}" >"$manifest"
          published=$(jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' "$manifest")
          echo "published: $published"
          [ "$published" = "linux/amd64 linux/arm64" ] || exit 1

  publish-registry:
    name: Publish Official MCP Registry
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download released MCPB bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcpb"
          gh release download "$GITHUB_REF_NAME" --pattern '*.mcpb' --dir "$RUNNER_TEMP/mcpb"
      - name: Generate registry manifest
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-registry"
          scripts/render_server_json.sh \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/mcpb" \
            "$RUNNER_TEMP/mcp-registry/server.json"
      - name: Install mcp-publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $archive" \
            | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - id: registry_version
        name: Check existing registry version
        run: |
          manifest="$RUNNER_TEMP/mcp-registry/server.json"
          name=$(jq -r .name "$manifest")
          version=$(jq -r .version "$manifest")
          name_path=$(jq -rn --arg value "$name" '$value | @uri')
          version_path=$(jq -rn --arg value "$version" '$value | @uri')
          record="$RUNNER_TEMP/mcp-registry/record.json"
          status=$(curl --silent --show-error --output "$record" --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$name_path/versions/$version_path")
          case "$status" in
            200)
              jq -S . "$manifest" >"$RUNNER_TEMP/mcp-registry/expected.json"
              jq -S .server "$record" >"$RUNNER_TEMP/mcp-registry/actual.json"
              cmp "$RUNNER_TEMP/mcp-registry/expected.json" "$RUNNER_TEMP/mcp-registry/actual.json"
              echo "publish=false" >>"$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "registry lookup returned HTTP $status" >&2
              exit 1
              ;;
          esac
      - name: Authenticate to MCP Registry
        if: steps.registry_version.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish server to MCP Registry
        if: steps.registry_version.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/mcp-registry/server.json"'
