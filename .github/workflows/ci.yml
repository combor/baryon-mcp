name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          cache: false

  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: Shell script checks
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck scripts/render_server_json.sh scripts/render_server_json_test.sh scripts/mcpb-pack-all.sh
          bash scripts/render_server_json_test.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json

  container-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: baryon-mcp:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: MCP introspection without credentials
        env:
          BARYON_SMOKE_IMAGE: baryon-mcp:ci
        run: go test -count=1 -run TestContainerServesIntrospection ./cmd/baryon-mcp

  release:
    name: Release
    needs:
      - test
      - govulncheck
      - container-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Notarization waits on Apple per darwin binary in turn, up to 20 minutes
    # each, on top of build and upload.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SSH private key of the AUR account that owns baryon-mcp-bin.
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # The job's own token cannot write to combor/homebrew-tap, so the cask
          # needs a PAT with contents write access to that repository.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # GoReleaser pushes the manifest to combor/winget-pkgs and opens a PR
          # against microsoft/winget-pkgs, which requires a PAT for the fork.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          # Developer ID certificate and App Store Connect key used to sign and
          # notarize the darwin binaries.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: Pack MCPB bundles
        run: scripts/mcpb-pack-all.sh
      - name: Attach MCPB bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --clobber

  publish-container:
    name: Publish Container Image
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The arm64 image is cross-compiled by Go and its runtime stage only
      # copies that binary in, so no emulation is involved.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/combor/baryon-mcp
          # A prerelease tag such as v0.4.0-rc1 must not move latest.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published image is public
        run: |
          repo=combor/baryon-mcp
          manifest=$RUNNER_TEMP/ghcr-manifest.json
          if ! curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" -o "$RUNNER_TEMP/ghcr-token.json"; then
            echo "anonymous pull denied: set the GHCR package to public in its settings, then re-run this job"
            exit 1
          fi
          token=$(jq -r .token "$RUNNER_TEMP/ghcr-token.json")
          curl -fsSL -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/$repo/manifests/${{ steps.build.outputs.digest }}" >"$manifest"
          published=$(jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' "$manifest")
          echo "published: $published"
          [ "$published" = "linux/amd64 linux/arm64" ] || exit 1

  publish-registry:
    name: Publish Official MCP Registry
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download released MCPB bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcpb"
          gh release download "$GITHUB_REF_NAME" --pattern '*.mcpb' --dir "$RUNNER_TEMP/mcpb"
      - name: Generate registry manifest
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-registry"
          scripts/render_server_json.sh \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/mcpb" \
            "$RUNNER_TEMP/mcp-registry/server.json"
      - name: Install mcp-publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $archive" \
            | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - id: registry_version
        name: Check existing registry version
        run: |
          manifest="$RUNNER_TEMP/mcp-registry/server.json"
          name=$(jq -r .name "$manifest")
          version=$(jq -r .version "$manifest")
          name_path=$(jq -rn --arg value "$name" '$value | @uri')
          version_path=$(jq -rn --arg value "$version" '$value | @uri')
          record="$RUNNER_TEMP/mcp-registry/record.json"
          status=$(curl --silent --show-error --output "$record" --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$name_path/versions/$version_path")
          case "$status" in
            200)
              jq -S . "$manifest" >"$RUNNER_TEMP/mcp-registry/expected.json"
              jq -S .server "$record" >"$RUNNER_TEMP/mcp-registry/actual.json"
              cmp "$RUNNER_TEMP/mcp-registry/expected.json" "$RUNNER_TEMP/mcp-registry/actual.json"
              echo "publish=false" >>"$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "registry lookup returned HTTP $status" >&2
              exit 1
              ;;
          esac
      - name: Authenticate to MCP Registry
        if: steps.registry_version.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish server to MCP Registry
        if: steps.registry_version.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/mcp-registry/server.json"'
